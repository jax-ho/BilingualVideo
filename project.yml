name: BilingualVideo

options:
  bundleIdPrefix: com.jax
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BilingualVideo:
    type: application
    platform: iOS
    productName: "放牛班的春天"
    sources:
      - path: BilingualVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jax.BilingualVideo
        PRODUCT_NAME: "放牛班的春天"
        PRODUCT_MODULE_NAME: BilingualVideo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BilingualVideo/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BilingualVideoTests
        - BilingualVideoUITests
      gatherCoverageData: true

  BilingualVideoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BilingualVideoTests
    dependencies:
      - target: BilingualVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jax.BilingualVideoTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/放牛班的春天.app/放牛班的春天"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BilingualVideoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BilingualVideoUITests
    dependencies:
      - target: BilingualVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jax.BilingualVideoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BilingualVideo
